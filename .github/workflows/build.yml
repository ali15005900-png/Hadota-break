
name: Build Hadota Break APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HadotaBreak-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Unpack Android project
        run: unzip -o HadotaBreak-Android-Project.zip

      - name: Build debug APK
        working-directory: hadota-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadota-Break-APK
          path: hadota-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
